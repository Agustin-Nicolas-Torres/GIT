<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Simple Sin Form</title>
</head>
<body>

    <div class="Registro-Caja">
        
        <div class="titulo-container">
            <h1>Crear Cuenta</h1>
            
        </div>

        <br>

        <div class="grupo-entrada">
            <span>Nombre Completo:</span>
            <br>
            <input type="text" placeholder="Ej: Juan Pérez">
        </div>

        <br>

        <div class="grupo-entrada">
            <span>Correo Electrónico:</span>
            <br>
            <input type="email" placeholder="nombre@correo.com">
        </div>

        <br>

        <div class="grupo-entrada">
            <span>Crear Contraseña:</span>
            <br>
            <input type="password" placeholder="Mínimo 6 caracteres">
        </div>

        <br>

        <div class="grupo-entrada">
            <span>Repetir Contraseña:</span>
            <br>
            <input type="password" placeholder="Valida tu clave">
        </div>

        <br>

        <div class="acciones">
            <button type="button">Registrarme ahora</button>
        </div>

    </div>

</body>
</html>
